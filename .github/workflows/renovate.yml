name: Renovate
on:
  workflow_dispatch:
  schedule:
    # Run daily at 03:27 UTC (using a non-zero minute to avoid top-of-the-hour GitHub Actions queue spikes)
    - cron: '27 3 * * *'

concurrency: renovate

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Host Egress Traffic
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate Agent
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
